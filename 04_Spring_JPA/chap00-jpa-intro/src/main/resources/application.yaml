spring:
  application:
    name: chap00-jpa-intro

  datasource:
    url: jdbc:mysql://localhost:3306/menudb #Connection -> Properties -> URL 가져오는 거임
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace

# Swagger config
springdoc:
  api-docs:
    #커스텀 UI를 만들거나 다른 도구와 연동할 때 사용(JSON으로 된 데이터 주소)
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method